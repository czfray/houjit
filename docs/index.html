<!doctype html>
<html>
    <head>
        <link rel="manifest" href="./manifest.json">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-status-bar-style" content="default">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

        <title>好熱 hou2jit6</title>
        <meta name="description" content="睇吓依家香港天氣點啦 View Current Hong Kong Weather">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@100..900&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="./style.css?v=0.2.4">
        <script type="module" src="./index.js?v=0.2.4"></script>

        <link rel="icon" type="image/png" href="./icon.png">
        <link rel="apple-touch-icon" href="./icon.png">
    </head>

    <body>
        <br>
        <div class = "smallInfoContainer">
            
            <div class="smallInfo">
                <img src="./../icons/uv.svg" alt="UV">
                <span id="uv">6</span>
            </div>

            <div class="smallInfo">
                <img src="./../icons/humidity.svg" alt="Humidity" class = "smallInfoImgCorr">
                <span id="humid">67%</span>
            </div>

            <div class="smallInfo">
                <img src="./../icons/wind.svg" alt="Wind">
                <span id="wind">67 km/h</span>
            </div>

        </div>

        <h1 class="centerText" id="temp">67.6°</h1>

        <div class="tempInfoContainer">
            <div class="smallInfoContainerVert">
                <div class="smallInfo">
                    <img src="./../icons/maxTemp.svg" alt="Max Temperature">
                    <span id="maxTemp">67.6°</span>
                </div>
                <br>
                <div class="smallInfo">
                    <img src="./../icons/minTemp.svg" alt="Min Temperature">
                    <span id="minTemp">67.6°</span>
                </div>
            </div>

            <div class="mediumInfo">
                <img src="./../icons/aprntTemp.svg" alt="Apparent Temperature">
                    <span id="aprntTemp">67.6°</span>
            </div>
        </div>

        <p class="bottomText" id="lastUpdate">Last Updated 67+67 mins ago</p>
    </body>
</html>
